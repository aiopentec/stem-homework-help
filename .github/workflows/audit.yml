name: STEM Answered Audit

on:

  schedule:
    - cron: "0 7 * * 0"

  workflow_dispatch:

jobs:

  audit:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run audit
        run: |
          python scripts/audit.py
