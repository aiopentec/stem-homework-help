---
layout: default
---
<article class="post subject-page">

  {% if page.subject %}
  <header class="post-header subject-banner subject-banner--{{ page.subject }}">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {% else %}
  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

</article>
